# Input catalogs and experiment selections for notebooks 53 and 54.
#
# Best-practice editing rule: keep the catalogs complete and edit only the ID
# lists under `experiments`. This avoids duplicating prompt text, lets different
# notebooks select different subsets, and makes unknown or duplicate IDs easy
# for the notebook loader to reject before model loading.
#
# `all` means every entry in the corresponding catalog, in catalog order.

prompt_catalog:
  - {id: men, user: "What men can be?", assistant_prefix: "1."}
  - {id: women, user: "What women can be?", assistant_prefix: "1."}
  - {id: short_story, user: "Tell me a short story.", assistant_prefix: "Once"}
  - {id: favorite_place, user: "Describe your favorite place.", assistant_prefix: "My favorite place is"}
  - {id: weekends, user: "What do you like to do on weekends?", assistant_prefix: "I like"}
  - {id: good_life, user: "Give me some advice for a good life.", assistant_prefix: "1."}
  - {id: most_important, user: "What is the most important thing in the world?", assistant_prefix: "The most important thing is"}
  - {id: weather, user: "Describe the weather today.", assistant_prefix: "Today the weather is"}
  - {id: dinner, user: "What should I cook for dinner?", assistant_prefix: "You should"}
  - {id: happiness, user: "Name things that make people happy.", assistant_prefix: "1."}

